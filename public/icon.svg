<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#070913" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Madhubani Sun Rays -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <circle r="140" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
    <circle r="160" fill="none" stroke="url(#redGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />
  </g>

  <!-- Central Musical Symbol & Sur-Mithila Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Stylized Veena / Treble Note -->
    <path d="M-30,-90 C0,-130 60,-130 80,-80 C95,-40 60,-10 30,15 L30,95 C30,125 -10,135 -35,115 C-60,95 -45,60 -15,60 C5,60 15,75 15,90 L15,10 C15,-40 40,-60 10,-80 Z" fill="url(#goldGrad)" />
    <!-- Sacred Vermilion Bindi Accent -->
    <circle cx="-10" cy="-40" r="16" fill="url(#redGrad)" />
    <!-- Inner Sound Wave -->
    <circle cx="25" cy="95" r="8" fill="#F8FAFC" />
  </g>

  <!-- Cultural Lotus Petal Accents at Base -->
  <path d="M196,410 Q256,380 316,410 Q256,440 196,410 Z" fill="url(#redGrad)" opacity="0.8" />
  <circle cx="256" cy="410" r="6" fill="url(#goldGrad)" />
</svg>
