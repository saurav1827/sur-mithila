<!DOCTYPE html>
<html lang="mai">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>इन्टरनेट नहि अछि | Sur-Mithila</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      background-color: #06080F;
      color: #FAFAFA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      background: rgba(20, 24, 38, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 140, 0, 0.2);
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 140, 0, 0.1);
    }
    .logo-img {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 16px rgba(255, 140, 0, 0.4));
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #FFFFFF;
      font-weight: 700;
    }
    p {
      color: #A1A1AA;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #FF8C00, #FF2E63);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 46, 99, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-retry:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="/icon.svg" alt="Sur-Mithila Logo" class="logo-img">
    <h1>इन्टरनेट संयोजन नहि अछि</h1>
    <p>कृपया अपन इन्टरनेट कनेक्शन जाँच करू आ पुनः प्रयास करू।</p>
    <button class="btn-retry" onclick="window.location.reload()">
      पुनः प्रयास करू (Retry)
    </button>
  </div>
</body>
</html>
